[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "curvecurator-mcp"
version = "0.1.0"
description = "MCP server exposing the CurveCurator dose-response statistics (doi:10.1038/s41467-023-43696-z) by calling the authors' curve_curator package"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=2.0",
    "curve_curator>=0.6.0,<0.7.0",
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
curvecurator-mcp = "curvecurator_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
curvecurator_mcp = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
    # Raised inside curve_curator's own thresholding module, not by this package.
    "ignore:Downcasting behavior in `replace`:FutureWarning",
]
