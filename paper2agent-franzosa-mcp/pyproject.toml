[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "franzosa-heparg-mcp"
version = "0.1.0"
description = "MCP server exposing the Franzosa et al. (2021) HepaRG toxicogenomic screen (doi:10.1038/s41540-020-00166-2)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
franzosa-mcp = "franzosa_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
franzosa_mcp = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
